<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Bot Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #172330; }
    canvas { display: block; width: 100%; height: 100%; }
    #status { position: fixed; top: 16px; left: 16px; right: 16px; z-index: 1; width: fit-content;
      max-width: calc(100% - 64px); padding: 12px 16px; background: #142230ed; color: #eef4f7;
      border-radius: 8px; font: 14px/1.6 system-ui, sans-serif; white-space: pre-line; pointer-events: none; }
    #status.error { background: #7c2727ed; }
  </style>
</head>
<body>
  <div id="status" role="status">뷰어를 불러오는 중입니다…</div>
  <script>
    const statusBox = document.getElementById('status')
    let renderError = false
    function showError(message) {
      renderError = true
      statusBox.className = 'error'
      statusBox.textContent = '화면을 표시할 수 없습니다.\n' + message
    }
    window.addEventListener('error', event => {
      showError(event.message || ('리소스 로딩 실패: ' + (event.target.src || '알 수 없음')))
    }, true)
    window.addEventListener('unhandledrejection', event => showError(String(event.reason)))
    async function updateStatus() {
      try {
        const response = await fetch('status', { cache: 'no-store' })
        if (!response.ok) throw new Error('HTTP ' + response.status)
        const info = await response.json()
        if (info.error) return showError(info.error)
        if (renderError) return
        statusBox.className = ''
        statusBox.textContent = (info.mode === 'demo'
          ? '오프라인 데모 · 실제 서버 월드가 아닙니다'
          : '봇의 1인칭 화면 · Minecraft ' + info.sourceVersion)
          + '\n표시 형식 ' + info.displayVersion + ' · 종료: 터미널 Ctrl+C'
          + (info.connected ? '' : '\n봇 접속이 종료되었습니다.')
          + (info.approximated.length ? '\n일부 신규 블록은 대체 모양으로 표시됩니다.' : '')
      } catch (_) {
        if (!renderError) {
          statusBox.className = 'error'
          statusBox.textContent = '뷰어 서버가 종료되었거나 연결이 끊겼습니다.\n봇 실행 중에만 실시간 화면을 볼 수 있습니다.'
        }
      }
    }
    updateStatus()
    setInterval(updateStatus, 2000)
  </script>
  <script src="index.js"></script>
</body>
</html>
